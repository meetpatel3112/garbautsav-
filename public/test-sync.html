<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GarbaUtsav Sync Test</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#fff;padding:20px;max-width:600px;margin:0 auto}
.box{padding:16px;border-radius:10px;margin:12px 0;font-size:15px;font-weight:bold}
.ok{background:#1a3a1a;border:2px solid #2ecc71;color:#2ecc71}
.err{background:#3a1a1a;border:2px solid #e74c3c;color:#e74c3c}
.info{background:#1a2a3a;border:2px solid #3498db;color:#88bbff}
button{padding:12px 24px;margin:6px;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:bold}
.btn-r{background:#E31E24;color:#fff}
.btn-g{background:#2ecc71;color:#000}
pre{background:#222;padding:12px;border-radius:8px;overflow:auto;font-size:12px;white-space:pre-wrap}
</style>
</head>
<body>
<h2>🔥 GarbaUtsav Firebase Test</h2>
<div id="log"></div>

<button class="btn-r" onclick="testWrite()">Step 1: Firebase Write Test</button>
<button class="btn-g" onclick="testRead()">Step 2: Firebase Read Test</button>
<button class="btn-r" onclick="writeSampleCostume()">Step 3: Sample Costume Add Karo</button>
<button class="btn-g" onclick="readCostumes()">Step 4: Costumes Read Karo</button>

<script>
const FB = "https://garbautsav-898e2-default-rtdb.firebaseio.com";

function log(msg, type='info') {
  const d = document.createElement('div');
  d.className = 'box ' + type;
  d.innerHTML = msg;
  document.getElementById('log').prepend(d);
}

async function testWrite() {
  log('⏳ Writing to Firebase...', 'info');
  try {
    const r = await fetch(FB + '/test.json', {
      method: 'PUT',
      body: JSON.stringify({msg: 'Hello from GarbaUtsav!', time: new Date().toISOString()})
    });
    const d = await r.json();
    if (r.ok) log('✅ WRITE SUCCESS: ' + JSON.stringify(d), 'ok');
    else log('❌ WRITE FAILED: HTTP ' + r.status + '<br>' + JSON.stringify(d), 'err');
  } catch(e) {
    log('❌ WRITE ERROR: ' + e.message, 'err');
  }
}

async function testRead() {
  log('⏳ Reading from Firebase...', 'info');
  try {
    const r = await fetch(FB + '/test.json');
    const d = await r.json();
    if (r.ok && d) log('✅ READ SUCCESS: ' + JSON.stringify(d), 'ok');
    else log('❌ READ FAILED or empty', 'err');
  } catch(e) {
    log('❌ READ ERROR: ' + e.message, 'err');
  }
}

async function writeSampleCostume() {
  log('⏳ Adding test costume to Firebase...', 'info');
  const testData = {
    data: {
      costumes: {
        test_costume_1: {
          id: 'test_costume_1',
          name: 'TEST Costume - Agar yeh dikhega toh kaam kar raha hai!',
          emoji: '🎉',
          em: '🎉',
          colorClass: 'ci1',
          cl: 'ci1',
          desc: 'Yeh test costume hai - agar main website pe dikhega toh Firebase kaam kar raha hai!',
          tags: ['Test', 'Firebase', 'Working'],
          pricePerDay: 999,
          price: 999,
          deposit: 100,
          dep: 100,
          available: 50,
          avail: 50,
          rating: 5.0,
          reviews: 0,
          sizes: ['S', 'M', 'L']
        }
      }
    }
  };
  try {
    const r = await fetch(FB + '/data/costumes/test_costume_1.json', {
      method: 'PUT',
      body: JSON.stringify(testData.data.costumes.test_costume_1)
    });
    const d = await r.json();
    if (r.ok) log('✅ TEST COSTUME SAVED! <br>Ab main website refresh karo - "TEST Costume" dikhna chahiye!', 'ok');
    else log('❌ SAVE FAILED: ' + JSON.stringify(d), 'err');
  } catch(e) {
    log('❌ ERROR: ' + e.message + '<br>Firebase Rules check karo!', 'err');
  }
}

async function readCostumes() {
  log('⏳ Reading costumes from Firebase...', 'info');
  try {
    const r = await fetch(FB + '/data/costumes.json');
    const d = await r.json();
    if (r.ok && d) {
      const costumes = Object.values(d);
      log('✅ ' + costumes.length + ' costumes Firebase mein hain:<br><pre>' + 
          costumes.map(c => c.name).join('\n') + '</pre>', 'ok');
    } else {
      log('⚠️ Firebase mein koi costume nahi. Step 3 pehle chalao!', 'info');
    }
  } catch(e) {
    log('❌ READ ERROR: ' + e.message, 'err');
  }
}

// Auto test on load
testRead();
</script>
</body>
</html>
