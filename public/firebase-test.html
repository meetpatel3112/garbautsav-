<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Firebase Test</title>
<style>
body{font-family:sans-serif;padding:30px;background:#111;color:#fff;max-width:500px;margin:0 auto}
.box{padding:20px;border-radius:12px;margin:15px 0;font-size:16px;font-weight:bold}
.ok{background:#1a3a1a;border:2px solid #2ecc71;color:#2ecc71}
.err{background:#3a1a1a;border:2px solid #e74c3c;color:#e74c3c}
.wait{background:#1a2a3a;border:2px solid #3498db;color:#3498db}
button{padding:12px 28px;background:#E31E24;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin:8px 4px;font-weight:bold}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;font-size:15px;margin:8px 0}
</style>
</head>
<body>
<h2>🔥 Firebase Connection Test</h2>
<div id="status" class="box wait">⏳ Testing Firebase connection...</div>

<h3>Test — Data Write karo</h3>
<input id="testVal" placeholder="Kuch bhi likho (e.g. Hello GarbaUtsav!)" />
<button onclick="writeTest()">Firebase mein Save karo</button>
<button onclick="readTest()">Firebase se Read karo</button>
<div id="result" class="box wait" style="display:none"></div>

<script>
const FB = "https://garbautsav-898e2-default-rtdb.firebaseio.com";

// Auto connection test
async function testConnection() {
  const s = document.getElementById('status');
  try {
    const r = await fetch(FB + '/test.json');
    if (r.ok) {
      s.className = 'box ok';
      s.textContent = '✅ Firebase CONNECTED! garbautsav-898e2 se connected hai.';
    } else {
      throw new Error('HTTP ' + r.status);
    }
  } catch(e) {
    s.className = 'box err';
    s.textContent = '❌ Firebase connection FAILED: ' + e.message + ' — Rules check karo!';
  }
}

async function writeTest() {
  const val = document.getElementById('testVal').value.trim();
  if (!val) { alert('Kuch likho pehle!'); return; }
  const r = document.getElementById('result');
  r.style.display = 'block';
  r.className = 'box wait';
  r.textContent = '⏳ Saving...';
  try {
    const res = await fetch(FB + '/test.json', {
      method: 'PUT',
      body: JSON.stringify({ message: val, time: new Date().toISOString() })
    });
    if (res.ok) {
      r.className = 'box ok';
      r.textContent = '✅ SAVE SUCCESSFUL! "' + val + '" Firebase mein save ho gaya!';
    } else {
      const err = await res.text();
      throw new Error(err);
    }
  } catch(e) {
    r.className = 'box err';
    r.textContent = '❌ SAVE FAILED: ' + e.message + '\n\nFirebase Rules mein .write: true karo!';
  }
}

async function readTest() {
  const r = document.getElementById('result');
  r.style.display = 'block';
  r.className = 'box wait';
  r.textContent = '⏳ Reading...';
  try {
    const res = await fetch(FB + '/test.json');
    const data = await res.json();
    if (data) {
      r.className = 'box ok';
      r.textContent = '✅ READ SUCCESSFUL! Data: ' + JSON.stringify(data);
    } else {
      r.className = 'box wait';
      r.textContent = '⚠️ Koi data nahi mila — pehle Save karo!';
    }
  } catch(e) {
    r.className = 'box err';
    r.textContent = '❌ READ FAILED: ' + e.message;
  }
}

testConnection();
</script>
</body>
</html>
